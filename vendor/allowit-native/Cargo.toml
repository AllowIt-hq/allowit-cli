[package]
name = "allowit-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "0.22.1"
bs58 = "0.5.1"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.2.0"
libc = "0.2.190"
regex = "1.11.1"
reqwest = { version = "0.12.23", default-features = false, features = ["blocking", "native-tls-vendored"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
uuid = { version = "1.18.0", features = ["v4"] }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
