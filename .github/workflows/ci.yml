name: CI

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go/go.mod
      - name: Install Rust toolchain and static target
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt --target x86_64-unknown-linux-musl
          rustup default 1.98.0
          sudo apt-get update
          sudo apt-get install -y musl-tools perl make
          echo CC_x86_64_unknown_linux_musl=musl-gcc >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - name: Local source and provenance checks
        run: |
          python3 scripts/sync-native-sdk.py verify
          python3 scripts/package-licenses.py
          python3 scripts/test-package-licenses.py
          python3 scripts/test-binary-provenance.py
          python3 scripts/test-tempo-sdk-review.py
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Local Rust and Go unit tests
        run: |
          cargo test --locked --lib --bins
          cargo test --locked --test paysh --test vendor --test stellar
          cargo test --locked --test native -- --skip generate_is_offline_native_and_preserves_policy_instance
          cd reference/go && go vet ./... && go test -race -count=1 ./...
          cd ../.. && go test -race -count=1 ./integration
      - name: Build static Linux binary
        run: make dist
      - name: Check the binary is static and runs
        run: |
          file dist/allowit-linux-amd64 | grep -Eq 'statically linked|static-pie linked'
          ./dist/allowit-linux-amd64 version
      - uses: actions/upload-artifact@v4
        with:
          name: allowit-linux-amd64
          path: dist/
          retention-days: 14
